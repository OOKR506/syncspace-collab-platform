<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syncspace — 팀 협업 플랫폼</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Syncspace">
<link rel="stylesheet" href="tailwind.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>

  <style>
    /* 로그인 전(사이드바가 숨겨진 상태)에는 본문 여백과 모바일 상/하단 바를 없앤다 — JS 버전과 무관하게 동작 */
    #sidebar[style*="display: none"] ~ main{margin-left:0 !important}
    #sidebar[style*="display: none"] ~ main .app-topbar,
    #sidebar[style*="display: none"] ~ main .app-tabbar{display:none !important}
    #sidebar[style*="display: none"] ~ main #content{padding-bottom:0 !important}
  </style>
<style>
/* 읽기 쉬운 최소 글자 크기(12px). 미리 빌드된 tailwind.css에 없는 값은 여기서 보정 */
/* 브라우저 기본 '비밀번호 보기' 아이콘은 우리 보기 버튼과 겹치므로 숨김 */
input::-ms-reveal,input::-ms-clear{display:none}
input[type=password]::-webkit-credentials-auto-fill-button{visibility:hidden;pointer-events:none;position:absolute;right:0}
.nav-group-title,.badge-primary,.badge-neutral,.badge-success,.badge-warning,.badge-danger,.badge-info,[class*="text-[10px]"],[class*="text-[10.5px]"],[class*="text-[11px]"],[class*="text-[11.5px]"]{font-size:12px !important}
</style>
</head>
<body class="min-h-screen transition-colors">
  <div class="flex min-h-screen">

    <!-- ============ SIDEBAR ============ -->
    <aside id="sidebar" class="hidden lg:flex w-64 flex-col fixed h-full z-[45] overflow-y-auto" style="background:var(--surface);border-right:1px solid var(--border)">
      <!-- 프로젝트 스위처 트리거 (사이드바 어디서든 프로젝트 전환) -->
      <button onclick="openProjectSwitcher()" class="px-4 h-16 flex items-center gap-2.5 border-b shrink-0 text-left transition-colors" aria-label="프로젝트 전환" style="border-color:var(--border)" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background='transparent'">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center text-white shrink-0 icon-tile-brand">
          <i data-lucide="zap" class="w-[18px] h-[18px]"></i>
        </div>
        <div class="min-w-0 flex-1">
          <div class="text-[14px] font-bold truncate" style="color:var(--text)" id="current-project-name">Syncspace</div>
          <div id="user-area" class="text-[11.5px] truncate" style="color:var(--text-3)"></div>
        </div>
        <i data-lucide="chevrons-up-down" class="w-3.5 h-3.5 shrink-0" style="color:var(--text-3)"></i>
      </button>

      <!-- 커맨드 팔레트 + 빠른 작업 추가 -->
      <div class="mx-3 mt-3 flex gap-1.5">
        <button onclick="openCommandPalette()" class="flex-1 h-9 px-3 rounded-lg flex items-center gap-2 text-[12.5px] transition-colors" style="background:var(--surface-2);color:var(--text-3)">
          <i data-lucide="search" class="w-3.5 h-3.5"></i><span class="flex-1 text-left">검색 또는 이동...</span>
        </button>
        <button onclick="quickAddTask()" class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 transition-colors icon-tile-brand" style="color:#fff" title="빠른 작업 추가 (N)" aria-label="빠른 작업 추가">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      </div>

      <nav class="flex-1 px-2 pb-4">
        <div class="nav-group-title">전체</div>
        <button onclick="showView('dashboard')" id="nav-dashboard" class="nav-item"><i data-lucide="layout-dashboard"></i><span>대시보드</span></button>
        <button onclick="showView('mytasks')" id="nav-mytasks" class="nav-item"><i data-lucide="user-check"></i><span>내 작업</span></button>
        <button onclick="showView('notifications')" id="nav-notifications" class="nav-item"><i data-lucide="bell"></i><span class="flex-1 text-left">알림</span><span id="notif-badge" class="hidden h-[18px] px-1 rounded-full text-[10px] font-bold text-white flex items-center justify-center" style="background:var(--danger);min-width:18px">0</span></button>

        <div class="nav-group-title">이 프로젝트에서<span id="scope-project-name" class="font-normal normal-case" style="color:var(--text-3)"></span></div>
        <button onclick="showView('kanban')" id="nav-kanban" class="nav-item scoped-nav"><i data-lucide="columns-3"></i><span>할 일 목록</span></button>
        <button onclick="showView('calendar')" id="nav-calendar" class="nav-item scoped-nav"><i data-lucide="calendar"></i><span>캘린더</span></button>
        <button onclick="showView('roles')" id="nav-roles" class="nav-item scoped-nav"><i data-lucide="gauge"></i><span>파트별 진행률</span></button>
        <button onclick="showView('team')" id="nav-team" class="nav-item scoped-nav"><i data-lucide="users"></i><span>팀 멤버</span></button>
        <button onclick="showView('chat')" id="nav-chat" class="nav-item scoped-nav"><i data-lucide="message-square"></i><span>팀 채팅</span></button>

        <div class="nav-group-title">시스템</div>
        <button onclick="showView('profile')" id="nav-profile" class="nav-item"><i data-lucide="user"></i><span>프로필</span></button>
        <button onclick="showHelpModal()" id="nav-help" class="nav-item"><i data-lucide="help-circle"></i><span>도움말</span></button>
      </nav>

      <div class="p-3 border-t shrink-0 space-y-1" style="border-color:var(--border)">
        <button onclick="toggleLanguage()" class="nav-item justify-between">
          <span class="flex items-center gap-2.5"><i data-lucide="languages"></i><span id="lang-toggle-label">한국어</span></span>
          <span class="text-meta font-mono" id="lang-toggle-code">KO</span>
        </button>
        <button onclick="doLogout()" class="nav-item" style="color:var(--danger)"><i data-lucide="log-out"></i><span>로그아웃</span></button>
      </div>
    </aside>

    <!-- Mobile drawer backdrop -->
    <div id="drawer-backdrop" onclick="closeDrawer()" class="hidden lg:hidden fixed inset-0 drawer-dim z-40"></div>

    <!-- ============ MAIN ============ -->
    <main class="flex-1 min-w-0 lg:ml-64 flex flex-col min-h-screen">
      <!-- Mobile top bar -->
      <header class="app-topbar lg:hidden sticky top-0 z-30 flex items-center justify-between px-2 gap-1" style="background:var(--surface);border-bottom:1px solid var(--border)">
        <button onclick="openDrawer()" class="icon-btn shrink-0" aria-label="메뉴 열기"><i data-lucide="menu"></i></button>
        <button onclick="openProjectSwitcher()" class="flex-1 min-w-0 flex items-center justify-center gap-1.5 h-9 px-2 rounded-lg" style="color:var(--text)">
          <span class="font-bold text-[14.5px] truncate" id="mobile-project-name">Syncspace</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 shrink-0" style="color:var(--text-3)"></i>
        </button>
        <button onclick="openCommandPalette()" class="icon-btn shrink-0" aria-label="검색"><i data-lucide="search"></i></button>
        <button onclick="showView('notifications')" class="icon-btn relative shrink-0" aria-label="알림">
          <i data-lucide="bell"></i>
          <span id="notif-badge-mobile" class="hidden absolute top-1 right-1 w-2 h-2 rounded-full" style="background:var(--danger)"></span>
        </button>
      </header>

      <div id="content" class="flex-1 min-w-0 overflow-y-auto lg:pb-0"></div>

      <!-- Mobile tab bar -->
      <nav class="app-tabbar lg:hidden fixed bottom-0 left-0 right-0 z-30 flex items-stretch" style="background:var(--surface);border-top:1px solid var(--border)">
        <button onclick="showView('dashboard')" class="flex-1 flex flex-col items-center justify-center gap-0.5" style="color:var(--text-2)"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[10px] font-medium">대시보드</span></button>
        <button onclick="showView('mytasks')" class="flex-1 flex flex-col items-center justify-center gap-0.5" style="color:var(--text-2)"><i data-lucide="user-check" class="w-5 h-5"></i><span class="text-[10px] font-medium">내 작업</span></button>
        <button onclick="showView('kanban')" class="flex-1 flex flex-col items-center justify-center gap-0.5" style="color:var(--text-2)"><i data-lucide="columns-3" class="w-5 h-5"></i><span class="text-[10px] font-medium">할 일</span></button>
        <button onclick="showView('chat')" class="flex-1 flex flex-col items-center justify-center gap-0.5" style="color:var(--text-2)"><i data-lucide="message-square" class="w-5 h-5"></i><span class="text-[10px] font-medium">채팅</span></button>
        <button onclick="openDrawer()" class="flex-1 flex flex-col items-center justify-center gap-0.5" style="color:var(--text-2)"><i data-lucide="grip" class="w-5 h-5"></i><span class="text-[10px] font-medium">더보기</span></button>
      </nav>
    </main>
  </div>

  <!-- #9 오프라인 배너 -->
  <div id="offline-banner" class="hidden fixed top-0 left-0 right-0 z-[80] text-center text-[12.5px] font-medium py-1.5" style="background:var(--warning);color:#fff"></div>
  <!-- Modal root -->
  <div id="modal" class="hidden fixed inset-0 z-50"></div>
  <!-- Command palette root (#4) -->
  <div id="cmdk" class="hidden fixed inset-0 z-[60]"></div>
  <!-- Project switcher root -->
  <div id="pswitch" class="hidden fixed inset-0 z-[60]"></div>
  <!-- #1 @멘션 자동완성 드롭다운 -->
  <div id="mention-dropdown" class="hidden fixed z-[70] card" style="min-width:180px;max-width:240px"></div>
  <!-- Toast root -->
  <div id="toast-root" class="fixed bottom-20 lg:bottom-5 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center gap-2"></div>
  <!-- Global loading -->
  <div id="loading" class="fixed inset-0 z-[200] items-center justify-center" style="display:none;background:rgba(15,18,26,.35)">
    <div class="w-10 h-10 rounded-full border-[3px] animate-spin" style="border-color:var(--border-strong);border-top-color:var(--primary)"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <!-- #11 QR 초대, #12 PDF 리포트용 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <!-- App scripts -->
  <script src="firebase-config.js"></script>
  <script src="firebase-auth.js"></script>
  <script src="firebase-projects.js"></script>
  <script src="firebase-tasks.js"></script>
  <script src="firebase-calendar.js"></script>
  <script src="firebase-templates.js"></script>
  <script src="firebase-extras.js"></script>
  <script src="firebase-storage.js"></script>
  <script src="i18n-en.js"></script>
  <script src="app-v3.js"></script>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('service-worker.js').then(function(reg){
          // 새 배포(새 서비스워커)가 설치되면 자동으로 최신 페이지로 한 번만 새로고침합니다.
          // 이렇게 하면 사용자가 수동으로 하드 리프레시를 하지 않아도 UI 변경(예: 사이드바 색상 수정)이 바로 반영됩니다.
          reg.addEventListener('updatefound', function(){
            var nw = reg.installing;
            if(!nw) return;
            nw.addEventListener('statechange', function(){
              if(nw.state === 'activated' && navigator.serviceWorker.controller){
                if(!sessionStorage.getItem('ss-sw-reloaded')){
                  sessionStorage.setItem('ss-sw-reloaded', '1');
                  window.location.reload();
                }
              }
            });
          });
        }).catch(()=>{});
        // 컨트롤러가 바뀌면(새 SW가 페이지를 장악하면) 세션당 한 번만 새로고침
        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function(){
          if(reloading) return;
          if(!sessionStorage.getItem('ss-sw-reloaded')){
            reloading = true;
            sessionStorage.setItem('ss-sw-reloaded', '1');
            window.location.reload();
          }
        });
      });
    }
  </script>
</body>
</html>
