<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syncspace — 팀 협업 플랫폼</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<meta name="theme-color" content="#6C5CE7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Syncspace">
<link rel="stylesheet" href="tailwind.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>

  <style>
    /* 로그인 전(사이드바가 숨겨진 상태)에는 본문 여백과 모바일 상/하단 바를 없앤다 — JS 버전과 무관하게 동작 */
    #sidebar[style*="display: none"] ~ main{margin-left:0 !important}
    #sidebar[style*="display: none"] ~ main .app-topbar,
    #sidebar[style*="display: none"] ~ main .app-desktopbar,
    #sidebar[style*="display: none"] ~ main .app-tabbar{display:none !important}
    #sidebar[style*="display: none"] ~ main #content{padding-bottom:0 !important}
  </style>
<style>
/* 읽기 쉬운 최소 글자 크기(12px). 미리 빌드된 tailwind.css에 없는 값은 여기서 보정 */
/* 브라우저 기본 '비밀번호 보기' 아이콘은 우리 보기 버튼과 겹치므로 숨김 */
input::-ms-reveal,input::-ms-clear{display:none}
input[type=password]::-webkit-credentials-auto-fill-button{visibility:hidden;pointer-events:none;position:absolute;right:0}
/* ===== UI 일관성·접근성 보정 (대비 4.5:1, 터치 영역, 포커스 링) ===== */
:root{--text-3:#5B6577;--success:#047857;--warning:#B45309;--danger:#D4143F;
  --bg:#F6F7F9;--border:#E8E9EE;--border-strong:#D9DBE3;--text:#292B38;
  --primary:#6C5CE7;--primary-hover:#5948CE;--primary-soft:#F0EDFF;--primary-soft-text:#5948CE;--ring:108 92 231}
.badge-danger{color:#BE123C}
input::placeholder,textarea::placeholder{color:#6B7588;opacity:1}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0}
[role=button][tabindex]{cursor:pointer}
[role=button][tabindex]:focus-visible{outline-offset:-2px;border-radius:12px}
/* 작은 버튼·링크는 눈에 보이는 크기는 그대로 두고 누를 수 있는 영역만 넓힌다 */
.ss-hit{position:relative}
.ss-hit::after{content:"";position:absolute;inset:-13px -10px}
button.badge-primary{min-height:32px;padding-left:12px;padding-right:12px}
#content [class*="px-1.5"][class*="py-0.5"][role=button]{min-height:24px;display:flex;align-items:center}
@media (hover:none){.ss-hit::after{inset:-14px -12px}}
/* ===== Figma 디자인 반영: 사이드바 · 상단 바 · 색 ===== */
.ss-brand{height:68px;display:flex;align-items:center;gap:11px;padding:0 20px;font-size:17px;font-weight:700;color:var(--text);flex-shrink:0}
.ss-brand-tile{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#8174EE,#5948CE);box-shadow:0 7px 16px rgba(108,92,231,.22)}
.ss-project{margin:0 14px 8px;padding:10px;display:flex;align-items:center;gap:10px;border:1px solid #E9E8EF;border-radius:12px;background:#FAFAFD;text-align:left;flex-shrink:0;width:calc(100% - 28px)}
.ss-project:hover{background:var(--surface-2)}
.ss-project-tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-soft-text);font-weight:700;font-size:13px;flex-shrink:0}
#content .grid:has(.kpi-icon){margin-bottom:16px}
.text-page-title{font-size:26px !important;font-weight:600 !important;letter-spacing:-.01em}
.text-section-title{font-weight:600 !important}
@media (max-width:1023px){.text-page-title{font-size:22px !important}}
.ss-team{display:none;align-items:center}
@media (min-width:768px){.ss-team{display:flex}}
.ss-team-av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:var(--primary-soft);color:var(--primary-soft-text);font-size:12px;font-weight:700;border:2px solid var(--surface);margin-left:-8px}
.ss-team-av:first-child{margin-left:0}
.ss-side-foot{display:flex;align-items:center;gap:2px;padding:10px;border-top:1px solid var(--border);flex-shrink:0;position:sticky;bottom:0;background:var(--surface)}
.ss-foot-btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:40px;height:44px;border-radius:10px;color:var(--text-2);font-size:12px;font-weight:600;flex-shrink:0;gap:1px}
.ss-foot-btn:hover{background:var(--surface-2)}
.ss-foot-btn svg{width:17px;height:17px}
.ss-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ss-profile-card{flex:1;min-width:0}
.ss-profile-card{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;text-align:left}
.ss-profile-card:hover{background:var(--surface-2)}
.ss-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-soft-text);font-weight:700;font-size:14px;flex-shrink:0;line-height:1}
.nav-item{border-radius:10px}
.nav-group-title{text-transform:none !important;letter-spacing:.02em !important;font-weight:600 !important;color:var(--text-3) !important}
.app-desktopbar{position:sticky;top:0;z-index:30;align-items:center;gap:12px;height:64px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.ss-crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3);min-width:0}
.ss-crumb b{color:var(--text);font-weight:600;white-space:nowrap}
.ss-search{width:260px;height:38px;padding:0 10px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;background:#F8F8FA;color:var(--text-3);font-size:13px}
.ss-search:hover{background:var(--surface-2)}
.ss-search kbd{font-size:12px;font-family:inherit;padding:1px 6px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text-2)}
.ss-bell{border:1px solid var(--border);border-radius:10px;width:38px;height:38px}
/* ===== 페이지 공통 모양: 머리말 위 작은 라벨, 요약 줄, 칩, 도움말 목록 ===== */
.ss-eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--primary);margin-bottom:2px}
.ss-tile{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;line-height:0}
.ss-tile svg{width:20px;height:20px;display:block;flex:none}
.ss-tone-primary{background:var(--primary-soft);color:var(--primary-soft-text)}
.ss-tone-info{background:var(--info-soft);color:#1D4ED8}
.ss-tone-success{background:var(--success-soft);color:var(--success)}
.ss-tone-warning{background:var(--warning-soft);color:var(--warning)}
.ss-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.ss-strip>div{display:flex;align-items:center;gap:12px;padding:16px 18px;min-width:0}
.ss-strip>div+div{border-left:1px solid var(--border)}
.ss-stat-val{font-size:20px;font-weight:700;color:var(--text);line-height:1.2}
@media (max-width:640px){.ss-strip{grid-template-columns:1fr 1fr}.ss-strip>div:nth-child(2n){border-left:1px solid var(--border)}.ss-strip>div:nth-child(n+3){border-top:1px solid var(--border)}.ss-strip>div:nth-child(2n+1){border-left:0}}
.ss-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:13px;font-weight:600;transition:background .15s}
.ss-chip:hover{background:var(--surface-2)}
.ss-chip.active{background:var(--primary-soft);color:var(--primary-soft-text);border-color:transparent}
@media (max-width:1023px){.ss-chip{height:40px}}
.ss-group-head{padding:8px 16px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--text-2)}
@media (max-width:640px){.ss-lbl{display:none}}
.ss-faq{padding:0 18px}
.ss-faq summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;cursor:pointer;list-style:none}
.ss-faq summary::-webkit-details-marker{display:none}
.ss-faq summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--text-3);border-bottom:2px solid var(--text-3);transform:rotate(45deg);transition:transform .15s;flex-shrink:0;margin-right:4px}
.ss-faq[open] summary::after{transform:rotate(-135deg)}
.ss-faq p{padding:0 0 16px}
.ss-faq-static{padding:14px 18px}
.ss-faq-static p{margin-top:2px}
/* 모바일: 작업 목록 도구 모음 — 검색창은 한 줄 전체, 필터·정렬은 같은 너비로 나란히 */
@media (max-width:1023px){
  div:has(>#kanban-search-input){flex:1 1 100%;min-width:0}
  #kanban-search-input{width:100% !important}
  div:has(>#kanban-search-input) ~ select{flex:1 1 40%;width:auto !important;min-width:0}
}
.nav-group-title,.badge-primary,.badge-neutral,.badge-success,.badge-warning,.badge-danger,.badge-info,[class*="text-[10px]"],[class*="text-[10.5px]"],[class*="text-[11px]"],[class*="text-[11.5px]"]{font-size:12px !important}

/* ===== Figma 대시보드: 내 작업 · 오늘 일정 · 활성 프로젝트 ===== */
@media (min-width:1024px){.ss-span-3{grid-column:span 3 / span 3}}
.ss-panel{padding:0;overflow:hidden}
.ss-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.ss-link{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--primary);white-space:nowrap}
.ss-task-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.ss-task-row:hover{background:var(--surface-2)}
.ss-task-title{font-size:13.5px;font-weight:600;color:var(--text)}
.ss-task-title.done{text-decoration:line-through;color:var(--text-3)}
.ss-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);background:var(--surface);display:inline-grid;place-items:center;flex-shrink:0;color:#fff;padding:0}
.ss-check:hover{border-color:var(--primary)}
.ss-check.on{background:var(--primary);border-color:var(--primary)}
.ss-due{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-2);white-space:nowrap;min-width:64px;justify-content:flex-start}
.ss-due.today{color:var(--danger);font-weight:600}.ss-due.late{color:var(--danger);font-weight:600}
.ss-mini-av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--primary-soft);color:var(--primary-soft-text);font-size:12px;font-weight:700;flex-shrink:0}
.ss-add-row{display:flex;align-items:center;gap:8px;width:100%;padding:13px 20px;font-size:13px;color:var(--text-2);text-align:left}
.ss-add-row:hover{background:var(--surface-2);color:var(--primary)}
.ss-event{display:flex;align-items:stretch;gap:12px;padding:6px 0}
.ss-event-time{width:44px;font-size:12px;color:var(--text-2);padding-top:4px;flex-shrink:0}
.ss-event-bar{width:3px;border-radius:3px;flex-shrink:0}
.ss-wide-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;height:38px;border:1px solid var(--border);border-radius:10px;font-size:12px;font-weight:600;color:var(--primary);background:var(--surface)}
.ss-wide-btn:hover{background:var(--primary-soft)}
.ss-active{display:flex;align-items:center;gap:20px;padding:22px 24px;flex-wrap:wrap}
.ss-active-tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:22px;background:linear-gradient(145deg,#8174EE,#5948CE);box-shadow:0 8px 18px rgba(108,92,231,.25);flex-shrink:0}
.ss-active-info{min-width:0;flex:1 1 220px}
.ss-active-name{font-size:17px;font-weight:600;color:var(--text);margin:2px 0}
.ss-active-bar{flex:1.4 1 260px;min-width:0}
.ss-active-stats{display:flex;gap:26px;padding-left:22px;border-left:1px solid var(--border)}
.ss-active-stats div{display:flex;flex-direction:column;align-items:center;gap:2px}
.ss-active-stats b{font-size:18px;font-weight:700;color:var(--text)}
.ss-active-stats span{font-size:12px;color:var(--text-3)}
.ss-round-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2);flex-shrink:0}
.ss-round-btn:hover{background:var(--primary-soft);color:var(--primary)}
@media (max-width:767px){.ss-active-stats{border-left:0;padding-left:0}.ss-task-row{padding:12px 14px;flex-wrap:wrap}.ss-due{min-width:0}}

/* ===== Figma: 공통 칩/필터/세그먼트 ===== */
.ss-count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:7px;background:var(--surface-2);color:var(--text-2);font-size:12px;font-weight:600;margin-left:6px}
.ss-chip.active .ss-count{background:var(--surface);color:var(--primary-soft-text)}
.ss-filterbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px}
.ss-filter-search{position:relative;min-width:220px;flex:0 1 280px}
.ss-filter-search>span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);display:flex;pointer-events:none}
.ss-filter-search .input{padding-left:34px;height:38px}
.ss-seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-2)}
.ss-seg button{width:34px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-3)}
.ss-seg button.on{background:var(--surface);color:var(--primary);box-shadow:0 1px 2px rgba(41,43,56,.1)}
/* ===== Figma: 내 작업 보드 ===== */
.ss-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.ss-bcol{background:var(--surface-2);border:1px solid var(--border);border-radius:15px;padding:12px;min-height:240px}
.ss-bcol>header{display:flex;align-items:center;gap:8px;padding:4px 4px 12px}
.ss-bcol>header i{width:8px;height:8px;border-radius:50%}
.ss-bcol>header b{font-size:13px;color:var(--text)}
.ss-bcol>header em{margin-left:auto;font-style:normal;font-size:12px;color:var(--text-3)}
.ss-bcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.ss-bcard:hover{box-shadow:0 6px 16px rgba(41,43,56,.08);border-color:var(--border-strong)}
.ss-card-act{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;height:34px;border-radius:9px;background:var(--primary-soft);color:var(--primary-soft-text);font-size:12px;font-weight:600}
.ss-card-act:hover{filter:brightness(.97)}
.ss-card-act.done{background:var(--success-soft);color:var(--success)}
.ss-bempty{padding:28px 0;text-align:center;font-size:12px;color:var(--text-3);border:1px dashed var(--border-strong);border-radius:12px}
@media (max-width:1023px){.ss-board{grid-template-columns:1fr}}
/* ===== Figma: 칸반 컬럼이 화면 너비를 가득 채우도록 ===== */
.kanban-scroll .kanban-col{flex:1 1 0;min-width:280px;border:1px solid var(--border);border-radius:15px}
/* ===== Figma: 팀 멤버 카드 ===== */
.ss-member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ss-member{padding:20px}
.ss-member-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.ss-member-name{font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center}
.ss-member-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 10px;padding-top:14px;border-top:1px solid var(--border)}
.ss-member-stats div{display:flex;flex-direction:column;gap:2px}
.ss-member-stats span{font-size:12px;color:var(--text-3)}
.ss-member-stats b{font-size:14px;color:var(--text)}
/* ===== Figma: 팀 채팅 ===== */
.ss-chat{display:flex;height:calc(100vh - 64px - 52px);min-height:520px;border-top:1px solid var(--border);background:var(--surface)}
.ss-chat-side{width:264px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;background:var(--surface)}
.ss-chat-side-head{padding:18px 16px 10px}.ss-chat-side-head h2{font-size:15px;font-weight:600}
.ss-chat-search{padding:0 12px 6px}.ss-chat-search-ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);display:flex}
.ss-chat-label{padding:12px 16px 6px;font-size:12px;color:var(--text-3);font-weight:600}
.ss-chat-chan{display:flex;align-items:center;gap:8px;margin:0 8px;padding:10px 12px;border-radius:10px;font-size:13.5px;color:var(--text-2)}
.ss-chat-chan span{color:var(--text-3)}
.ss-chat-chan.active{background:var(--primary-soft);color:var(--primary-soft-text)}.ss-chat-chan.active span{color:var(--primary)}
.ss-chat-chan b{font-weight:600}
.ss-chat-member{display:flex;align-items:center;gap:10px;width:calc(100% - 16px);margin:0 8px;padding:8px 12px;border-radius:10px;font-size:13px;color:var(--text);text-align:left}
.ss-chat-member:hover{background:var(--surface-2)}
.ss-chat-member em{font-style:normal;font-size:12px;color:var(--text-3);margin-left:4px}
.ss-chat-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ss-chat-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border)}
.ss-chat-hash{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:17px;flex-shrink:0}
.ss-chat-head h2{font-size:15px;font-weight:600;line-height:1.2}.ss-chat-head p{font-size:12px;color:var(--text-3);margin-top:2px}
.ss-chat-count{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.ss-chat-msgs{flex:1;overflow-y:auto;padding:18px 24px}
.ss-msg{display:flex;gap:12px;margin-bottom:16px;max-width:78%}
.ss-msg.me{flex-direction:row-reverse;margin-left:auto}
.ss-msg-body{min-width:0;display:flex;flex-direction:column}
.ss-msg.me .ss-msg-body{align-items:flex-end}
.ss-msg-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px;color:var(--text-3)}
.ss-msg-head b{color:var(--text);font-weight:600;font-size:13px}
.ss-msg.me .ss-msg-head{flex-direction:row-reverse}
.ss-msg-del{color:var(--danger);font-size:12px;opacity:0}.ss-msg:hover .ss-msg-del,.ss-msg-del:focus{opacity:1}
.ss-bubble{padding:11px 15px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.ss-msg.me .ss-bubble{background:var(--primary);border-color:var(--primary);color:#fff}
.ss-composer{padding:12px 20px 16px}
.ss-composer-box{border:1px solid var(--border-strong);border-radius:12px;padding:10px 12px 8px;background:var(--surface)}
.ss-composer-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgb(var(--ring)/.15)}
.ss-composer-box input{width:100%;border:0;outline:0;background:transparent;font-size:14px;color:var(--text);padding:6px 0 10px}
.ss-composer-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-3)}
.ss-send{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center}
.ss-send:hover{background:var(--primary-hover)}
@media (max-width:1023px){.ss-chat{height:calc(100vh - 56px - 64px - 52px)}.ss-chat-side{display:none}.ss-msg{max-width:92%}}

/* ===== Figma 느낌으로 부드럽게: 아이콘 색·크기, 글자 굵기 (글자 대비는 그대로 유지) ===== */
.nav-item{font-weight:400}
.nav-item.active{font-weight:600}
.nav-item svg{color:#9EA1AE;stroke-width:1.8}
.nav-item:hover svg{color:var(--text-2)}
.nav-item.active svg{color:var(--primary-soft-text)}
.icon-btn svg,.ss-bell svg,.ss-search svg,.ss-foot-btn svg{color:#727685}
.icon-btn:hover svg{color:var(--text)}
.ss-tile svg,.kpi-icon svg{width:18px;height:18px}
.ss-tile{border-radius:11px}
.ss-tone-primary{background:#F0EDFF;color:#6C5CE7}
.ss-tone-info{background:#EAF3FB;color:#4B8FC8}
.ss-tone-success{background:#EAF6EF;color:#4FA57B}
.ss-tone-warning{background:#FDF0E8;color:#E8935A}
.kpi-icon svg{opacity:.8}
.ss-check{border-color:#D5D7DF}
.text-card-title{font-weight:500}
.text-section-title{font-weight:500 !important}
.text-page-title{font-weight:500 !important}
.ss-task-title,.ss-member-name{font-weight:500}
.ss-stat-val{font-weight:600}
#content .font-extrabold{font-weight:700}
#content .font-bold{font-weight:600}
.ss-chat-head h2,.ss-active-name{font-weight:500}
.dark .nav-item svg{color:var(--text-3)}
.dark .nav-item:hover svg{color:var(--text-2)}
.dark .nav-item.active svg{color:var(--primary-soft-text)}
.dark .icon-btn svg,.dark .ss-bell svg,.dark .ss-search svg,.dark .ss-foot-btn svg{color:var(--text-2)}
.dark .ss-tone-primary{background:var(--primary-soft);color:var(--primary-soft-text)}
.dark .ss-tone-info{background:var(--info-soft);color:var(--info)}
.dark .ss-tone-success{background:var(--success-soft);color:var(--success)}
.dark .ss-tone-warning{background:var(--warning-soft);color:var(--warning)}

/* ===== Figma: 월간 캘린더 날짜 격자 ===== */
.ss-cal{padding:0;overflow:hidden}
.ss-calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:560px}
.ss-calgrid>b{padding:11px 10px;border-bottom:1px solid var(--border);color:var(--text-3);font-size:12px;font-weight:500;text-align:center}
.ss-calgrid>div{min-height:112px;padding:10px;border-right:1px solid #F0F0F3;border-bottom:1px solid #F0F0F3;font-size:12px;color:var(--text-2);cursor:pointer;transition:background .15s;min-width:0}
.ss-calgrid>div:nth-child(7n){border-right:0}
.ss-calgrid>div:hover{background:#FAFAFD}
.ss-calgrid>div.muted{color:#C1C3CA;background:#FAFAFA}
.ss-calgrid>div>span{display:inline-grid;place-items:center;min-width:22px;height:22px;font-weight:500}
.ss-calgrid>div.current>span{border-radius:50%;background:var(--primary);color:#fff}
.ss-calgrid>div i{margin-top:6px;padding:4px 6px;display:block;overflow:hidden;text-overflow:ellipsis;border-radius:6px;font-size:11px;font-style:normal;white-space:nowrap;line-height:1.35}
.ss-calgrid>div em{display:block;margin-top:4px;font-size:11px;font-style:normal;color:var(--text-3)}
.dark .ss-calgrid>div{border-color:var(--border)}.dark .ss-calgrid>div.muted{background:var(--surface-2);color:var(--text-3)}.dark .ss-calgrid>div:hover{background:var(--surface-2)}
@media (max-width:640px){.ss-calgrid{min-width:0}.ss-calgrid>b{padding:9px 0;font-size:11px}.ss-calgrid>div{min-height:64px;padding:4px}.ss-calgrid>div i{font-size:10px;padding:2px 3px;margin-top:3px}}
.ss-prof{display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:32px;row-gap:20px;max-width:1040px;margin:0;padding:0 24px 32px;align-items:start}
.ss-prof>[data-ptab],.ss-prof-col>[data-ptab]{grid-column:2}
.ss-ptab-hide{display:none!important}
.ss-pnav{grid-column:1;grid-row:1/span 30;position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
.ss-pnav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:0;background:none;color:var(--text-2);font-size:14px;font-weight:500;text-align:left;cursor:pointer}
.ss-pnav button:hover{background:var(--surface-2)}
.ss-pnav button.on{background:var(--primary-soft,#EEECFD);color:var(--primary)}
.ss-pnav button.on svg{color:var(--primary)}
.ss-prof input[type=checkbox]{appearance:none;-webkit-appearance:none;width:38px!important;height:22px!important;border-radius:999px;background:#D5D7DE;position:relative;cursor:pointer;transition:background .15s;flex:none}
.ss-prof input[type=checkbox]::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.ss-prof input[type=checkbox]:checked{background:var(--primary)}
.ss-prof input[type=checkbox]:checked::after{transform:translateX(16px)}
@media (max-width:767px){.ss-prof{display:flex;flex-direction:column;gap:16px}.ss-pnav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}.ss-pnav button{white-space:nowrap;border:1px solid var(--border);background:var(--surface)}.ss-pnav button.on{border-color:var(--primary)}}
.ss-prof-col{display:contents}


.ss-prof-me{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ss-prof-me .ss-prof-id{flex:1;min-width:220px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.ss-prof-me .ss-prof-act{display:flex;flex-direction:column;gap:8px;min-width:170px}
.ss-prof-me .ss-prof-act button{width:100%;margin:0}
@media (min-width:640px){
.ss-prof .py-1,.ss-prof .py-1\.5{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ss-prof .py-1>.text-card-title,.ss-prof .py-1\.5>.text-card-title{margin:0}
.ss-prof select.input{width:260px;max-width:55%;flex:none}
.ss-prof .py-1\.5>.grid{width:340px;max-width:60%}}
@media (max-width:639px){.ss-prof{padding:0 16px 32px}}
.ss-prof-me>button>*{font-size:40px;line-height:1}
</style>
</head>
<body class="min-h-screen transition-colors">
  <div class="flex min-h-screen">

    <!-- ============ SIDEBAR ============ -->
    <aside id="sidebar" class="hidden lg:flex w-64 flex-col fixed h-full z-[45] overflow-y-auto" style="background:var(--surface);border-right:1px solid var(--border)">
      <!-- 로고 줄 -->
      <div class="ss-brand">
        <span class="ss-brand-tile"><i data-lucide="zap" class="w-[18px] h-[18px]"></i></span>
        <span>Syncspace</span>
      </div>
      <!-- 프로젝트 스위처 트리거 (사이드바 어디서든 프로젝트 전환) -->
      <button onclick="openProjectSwitcher()" class="ss-project" aria-label="프로젝트 전환">
        <span class="ss-project-tile" id="current-project-initial">S</span>
        <span class="min-w-0 flex-1 text-left">
          <span class="block text-[13px] font-bold truncate" style="color:var(--text)" id="current-project-name">Syncspace</span>
          <span class="block text-[12px] truncate" style="color:var(--text-3)">프로젝트 전환</span>
        </span>
        <i data-lucide="chevrons-up-down" class="w-3.5 h-3.5 shrink-0" style="color:var(--text-3)"></i>
      </button>

      <nav class="flex-1 px-2 pb-4">
        <div class="nav-group-title">전체</div>

        <button onclick="showView('calendar')" id="nav-calendar" class="nav-item scoped-nav"><i data-lucide="calendar"></i><span>캘린더</span></button>
        <button onclick="showView('roles')" id="nav-roles" class="nav-item scoped-nav"><i data-lucide="gauge"></i><span>파트별 진행률</span></button>
        <button onclick="showView('team')" id="nav-team" class="nav-item scoped-nav"><i data-lucide="users"></i><span>팀 멤버</span></button>
        <button onclick="showView('chat')" id="nav-chat" class="nav-item scoped-nav"><i data-lucide="message-square"></i><span class="flex-1 text-left">팀 채팅</span><span id="chat-badge" class="hidden h-[18px] px-1 rounded-full text-[10px] font-bold text-white flex items-center justify-center" style="background:var(--danger);min-width:18px" aria-label="안 읽은 메시지">0</span></button>

        <div class="nav-group-title">시스템</div>
        <button onclick="showView('profile')" id="nav-profile" class="nav-item"><i data-lucide="user"></i><span>프로필</span></button>
        <button onclick="showHelpModal()" id="nav-help" class="nav-item"><i data-lucide="help-circle"></i><span>도움말</span></button>
      </nav>

      <div class="ss-side-foot">
        <button onclick="showView('profile')" class="ss-profile-card" aria-label="프로필 열기">
          <span class="ss-avatar" id="side-user-avatar">?</span>
          <span class="min-w-0 flex-1 text-left"><span class="block text-[13px] font-semibold truncate" style="color:var(--text)" id="user-area"></span><span class="block text-[12px]" style="color:var(--text-3)">내 프로필</span></span>
        </button>
        <button onclick="doLogout()" class="ss-foot-btn" style="color:var(--danger)" title="로그아웃" aria-label="로그아웃"><i data-lucide="log-out"></i></button>
      </div>
    </aside>

    <!-- Mobile drawer backdrop -->
    <div id="drawer-backdrop" onclick="closeDrawer()" class="hidden lg:hidden fixed inset-0 drawer-dim z-40"></div>

    <!-- ============ MAIN ============ -->
    <main class="flex-1 min-w-0 lg:ml-64 flex flex-col min-h-screen">
      <!-- 데스크톱 상단 바: 경로 · 검색 · 알림 · 새 작업 -->
      <header class="app-desktopbar hidden lg:flex">
        <div class="ss-crumb"><span id="crumb-project" class="truncate">Syncspace</span><i data-lucide="chevron-right" class="w-3.5 h-3.5 shrink-0"></i><b id="crumb-view">대시보드</b></div>
        <div class="flex-1"></div>
        <button onclick="openCommandPalette()" class="ss-search" aria-label="검색 또는 이동"><i data-lucide="search" class="w-4 h-4"></i><span class="flex-1 text-left">검색 또는 이동...</span><kbd>Ctrl K</kbd></button>
        <button onclick="openNotifPopover(event)" class="tabbar-popover-trigger icon-btn relative shrink-0 ss-bell" title="알림" aria-label="알림 열기"><i data-lucide="bell" class="w-4 h-4"></i><span class="tabbar-bell-badge" style="display:none;position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;align-items:center;justify-content:center;line-height:1"></span></button>
        <button onclick="quickAddTask()" class="btn-primary shrink-0"><i data-lucide="plus" class="w-4 h-4"></i>새 작업</button>
      </header>
      <!-- Mobile top bar -->
      <header class="app-topbar lg:hidden sticky top-0 z-30 flex items-center justify-between px-2 gap-1" style="background:var(--surface);border-bottom:1px solid var(--border)">
        <button onclick="openDrawer()" class="icon-btn shrink-0" aria-label="메뉴 열기"><i data-lucide="menu"></i></button>
        <button onclick="openProjectSwitcher()" class="flex-1 min-w-0 flex items-center justify-center gap-1.5 h-9 px-2 rounded-lg" style="color:var(--text)">
          <span class="font-bold text-[14.5px] truncate" id="mobile-project-name">Syncspace</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 shrink-0" style="color:var(--text-3)"></i>
        </button>
        <button onclick="openCommandPalette()" class="icon-btn shrink-0" aria-label="검색"><i data-lucide="search"></i></button>
        <button onclick="showView('notifications')" class="icon-btn relative shrink-0" aria-label="알림">
          <i data-lucide="bell"></i>
          <span id="notif-badge-mobile" class="hidden absolute top-1 right-1 w-2 h-2 rounded-full" style="background:var(--danger)"></span>

      </header>

      <div id="content" class="flex-1 min-w-0 overflow-y-auto lg:pb-0"></div>

      <!-- Mobile tab bar -->

        <button onclick="showView('mytasks')" class="flex-1 flex flex-col items-center justify-center gap-0.5" style="color:var(--text-2)"><i data-lucide="user-check" class="w-5 h-5"></i><span class="text-[10px] font-medium">내 작업</span></button>
        <button onclick="showView('kanban')" class="flex-1 flex flex-col items-center justify-center gap-0.5" style="color:var(--text-2)"><i data-lucide="columns-3" class="w-5 h-5"></i><span class="text-[10px] font-medium">할 일</span></button>
        <button onclick="showView('chat')" class="flex-1 flex flex-col items-center justify-center gap-0.5" style="color:var(--text-2);position:relative"><span class="chat-badge-dot" style="display:none;position:absolute;top:6px;left:calc(50% + 6px);width:8px;height:8px;border-radius:9999px;background:var(--danger)"></span><i data-lucide="message-square" class="w-5 h-5"></i><span class="text-[10px] font-medium">채팅</span></button>
        <button onclick="openDrawer()" class="flex-1 flex flex-col items-center justify-center gap-0.5" style="color:var(--text-2)"><i data-lucide="grip" class="w-5 h-5"></i><span class="text-[10px] font-medium">더보기</span></button>

  <script src="app-v3.js"></script>
  <script src="guest-mode.js"></script>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('service-worker.js').then(function(reg){
          // 새 배포(새 서비스워커)가 설치되면 자동으로 최신 페이지로 한 번만 새로고침합니다.
          // 이렇게 하면 사용자가 수동으로 하드 리프레시를 하지 않아도 UI 변경(예: 사이드바 색상 수정)이 바로 반영됩니다.
          reg.addEventListener('updatefound', function(){
            var nw = reg.installing;
            if(!nw) return;
            nw.addEventListener('statechange', function(){
              if(nw.state === 'activated' && navigator.serviceWorker.controller){
                if(!sessionStorage.getItem('ss-sw-reloaded')){
                  sessionStorage.setItem('ss-sw-reloaded', '1');
                  window.location.reload();
                }
              }
            });
          });
        }).catch(()=>{});
        // 컨트롤러가 바뀌면(새 SW가 페이지를 장악하면) 세션당 한 번만 새로고침
        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function(){
          if(reloading) return;
          if(!sessionStorage.getItem('ss-sw-reloaded')){
            reloading = true;
            sessionStorage.setItem('ss-sw-reloaded', '1');
            window.location.reload();
          }
        });
      });
    }
  </script>
